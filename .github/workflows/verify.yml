name: Verify CRISIS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/crisis-web.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          npm run test:browser
        env:
          CRISIS_USE_PLAYWRIGHT_BROWSER: '1'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./tools/android.sh :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crisis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test native iOS
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if "iPhone" in v["name"]))')
          xcodebuild -project ios/CRISIS.xcodeproj -scheme CRISIS -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
